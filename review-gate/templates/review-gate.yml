# Review Gate — required check + CI cancel on new review findings.
# Installed from bernierllc/claude-skills skill `review-gate`.
# Pair with GitHub ruleset pull_request.required_review_thread_resolution: true.
#
# Required-check name is the job display name "Review Gate" (eligible events) or
# the Checks API check run of the same name (review-comment refresh path).
name: Review Gate

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: write
  checks: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Only cancel CI for new top-level P0/P1 findings (they need a new head).
  # Closing replies / Notion deferrals / P2-only comments must not cancel required
  # CI — those paths have no commit to restart cancelled jobs.
  cancel-ci-on-finding:
    if: github.event_name == 'pull_request_review_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress CI when a P0/P1 finding lands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IN_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
        run: |
          set -euo pipefail
          if [ -n "${IN_REPLY_TO}" ] && [ "${IN_REPLY_TO}" != "null" ]; then
            echo "Reply comment — skip CI cancel (no new head expected)"
            exit 0
          fi
          if printf '%s' "$COMMENT_BODY" | grep -qiE 'notion\.(so|com)/|fixed in|not-a-finding:'; then
            echo "Closing token — skip CI cancel"
            exit 0
          fi
          if ! printf '%s' "$COMMENT_BODY" | grep -qiE '(\[P0\]|\[P1\]|\bP0\b|\bP1\b)'; then
            echo "Not a P0/P1 finding — skip CI cancel"
            exit 0
          fi
          ids=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=in_progress&per_page=50" \
            --jq '.workflow_runs[] | select(.name != "Review Gate") | .id')
          ids_q=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=queued&per_page=50" \
            --jq '.workflow_runs[] | select(.name != "Review Gate") | .id')
          for id in $ids $ids_q; do
            echo "Cancelling run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || true
          done

  # Eligible events for required status checks (Actions job conclusion counts).
  gate:
    name: Review Gate
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review-gate checker
        uses: actions/checkout@v4
        with:
          # Include scripts/ so a vendored scripts/check-review-gate.py is used when present.
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: false

      - name: Run review-gate checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f scripts/check-review-gate.py ]; then
            python3 scripts/check-review-gate.py --pr "$PR_NUMBER" --repo "$REPO"
            exit $?
          fi
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          P2_ROOT = re.compile(r"\bp2\b", re.I)
          CLOSING = re.compile(
              r"notion\.(so|com)/|fixed in (commit )?`?[0-9a-f]{7,40}`?|not-a-finding:\s*\S",
              re.I,
          )
          FALLBACK = re.compile(r"\b(agy|superpowers|claude|antigravity)\b", re.I)
          REVIEW_SECTION = re.compile(r"(?m)^##\s+Review\b")
          MAIN_LABELS = {"review:high", "review:ultra"}

          def gh_graphql(query, **vars):
              args = ["gh", "api", "graphql", "-f", f"query={query}"]
              for k, v in vars.items():
                  args.extend(["-F", f"{k}={v}"])
              out = subprocess.check_output(args, text=True)
              return json.loads(out)

          owner, name = os.environ["REPO"].split("/", 1)
          number = int(os.environ["PR_NUMBER"])
          q = """
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                body baseRefName headRefOid
                labels(first: 50) { nodes { name } }
                reviews(last: 40) {
                  nodes { state body commit { oid } author { login } }
                }
                reviewThreads(first: 100) {
                  nodes {
                    comments(first: 20) { nodes { body } }
                  }
                }
              }
            }
          }
          """
          pr = gh_graphql(q, owner=owner, name=name, number=number)["data"]["repository"]["pullRequest"]
          reasons = []
          body = pr.get("body") or ""
          if not REVIEW_SECTION.search(body):
              reasons.append("PR body missing ## Review section")
          head = pr.get("headRefOid") or ""
          codex_ok = False
          for rev in pr.get("reviews", {}).get("nodes") or []:
              commit = (rev.get("commit") or {}).get("oid") or ""
              if head and commit and commit != head:
                  continue
              b = rev.get("body") or ""
              author = ((rev.get("author") or {}).get("login") or "").lower()
              if (rev.get("state") or "").upper() in ("PENDING", "DISMISSED"):
                  continue
              if "running" in b.lower() and len(b) < 400:
                  continue
              if "codex" in author or "chatgpt" in author or "codex" in b.lower():
                  codex_ok = True
                  break
          m = REVIEW_SECTION.search(body)
          fallback_ok = False
          if m:
              rest = body[m.end():]
              nh = re.search(r"(?m)^##\s+", rest)
              section = rest[: nh.start()] if nh else rest
              fallback_ok = bool(FALLBACK.search(section))
          if not (codex_ok or fallback_ok):
              reasons.append("No completed Codex review on current head / no named fallback in ## Review")
          for i, thread in enumerate(pr.get("reviewThreads", {}).get("nodes") or [], 1):
              comments = thread.get("comments", {}).get("nodes") or []
              if not comments or not P2_ROOT.search(comments[0].get("body") or ""):
                  continue
              if not any(CLOSING.search(c.get("body") or "") for c in comments[1:]):
                  reasons.append(f"P2 thread #{i} has no closing reply")
          if (pr.get("baseRefName") or "") == "main":
              labels = {n.get("name") for n in (pr.get("labels", {}).get("nodes") or [])}
              if not (labels & MAIN_LABELS):
                  reasons.append("base is main but review:high / review:ultra label missing")
          if reasons:
              print("review-gate failed:")
              for r in reasons:
                  print("-", r)
              sys.exit(1)
          print("review-gate ok")
          PY

  # pull_request_review_comment is NOT an eligible Actions event for required
  # checks (GitHub docs). Publish the same "Review Gate" context via Checks API
  # so a closing reply / resolve can clear a prior failure without a new push.
  gate-refresh-on-comment:
    if: github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review-gate checker
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: false

      - name: Evaluate and publish Review Gate check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checker=scripts/check-review-gate.py
          if [ ! -f "$checker" ]; then
            checker=/tmp/check-review-gate-inline.py
            cat > "$checker" <<'PY'
          import json, os, re, subprocess, sys

          P2_ROOT = re.compile(r"\bp2\b", re.I)
          CLOSING = re.compile(
              r"notion\.(so|com)/|fixed in (commit )?`?[0-9a-f]{7,40}`?|not-a-finding:\s*\S",
              re.I,
          )
          FALLBACK = re.compile(r"\b(agy|superpowers|claude|antigravity)\b", re.I)
          REVIEW_SECTION = re.compile(r"(?m)^##\s+Review\b")
          MAIN_LABELS = {"review:high", "review:ultra"}

          def gh_graphql(query, **vars):
              args = ["gh", "api", "graphql", "-f", f"query={query}"]
              for k, v in vars.items():
                  args.extend(["-F", f"{k}={v}"])
              out = subprocess.check_output(args, text=True)
              return json.loads(out)

          owner, name = os.environ["REPO"].split("/", 1)
          number = int(os.environ["PR_NUMBER"])
          q = """
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                body baseRefName headRefOid
                labels(first: 50) { nodes { name } }
                reviews(last: 40) {
                  nodes { state body commit { oid } author { login } }
                }
                reviewThreads(first: 100) {
                  nodes {
                    comments(first: 20) { nodes { body } }
                  }
                }
              }
            }
          }
          """
          pr = gh_graphql(q, owner=owner, name=name, number=number)["data"]["repository"]["pullRequest"]
          reasons = []
          body = pr.get("body") or ""
          if not REVIEW_SECTION.search(body):
              reasons.append("PR body missing ## Review section")
          head = pr.get("headRefOid") or ""
          codex_ok = False
          for rev in pr.get("reviews", {}).get("nodes") or []:
              commit = (rev.get("commit") or {}).get("oid") or ""
              if head and commit and commit != head:
                  continue
              b = rev.get("body") or ""
              author = ((rev.get("author") or {}).get("login") or "").lower()
              if (rev.get("state") or "").upper() in ("PENDING", "DISMISSED"):
                  continue
              if "running" in b.lower() and len(b) < 400:
                  continue
              if "codex" in author or "chatgpt" in author or "codex" in b.lower():
                  codex_ok = True
                  break
          m = REVIEW_SECTION.search(body)
          fallback_ok = False
          if m:
              rest = body[m.end():]
              nh = re.search(r"(?m)^##\s+", rest)
              section = rest[: nh.start()] if nh else rest
              fallback_ok = bool(FALLBACK.search(section))
          if not (codex_ok or fallback_ok):
              reasons.append("No completed Codex review on current head / no named fallback in ## Review")
          for i, thread in enumerate(pr.get("reviewThreads", {}).get("nodes") or [], 1):
              comments = thread.get("comments", {}).get("nodes") or []
              if not comments or not P2_ROOT.search(comments[0].get("body") or ""):
                  continue
              if not any(CLOSING.search(c.get("body") or "") for c in comments[1:]):
                  reasons.append(f"P2 thread #{i} has no closing reply")
          if (pr.get("baseRefName") or "") == "main":
              labels = {n.get("name") for n in (pr.get("labels", {}).get("nodes") or [])}
              if not (labels & MAIN_LABELS):
                  reasons.append("base is main but review:high / review:ultra label missing")
          if reasons:
              print("review-gate failed:")
              for r in reasons:
                  print("-", r)
              sys.exit(1)
          print("review-gate ok")
          PY
          fi
          set +e
          if [ -f scripts/check-review-gate.py ]; then
            out=$(python3 scripts/check-review-gate.py --pr "$PR_NUMBER" --repo "$REPO" 2>&1)
            rc=$?
          else
            out=$(python3 /tmp/check-review-gate-inline.py 2>&1)
            rc=$?
          fi
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            conclusion=success
            title="review-gate ok"
          else
            conclusion=failure
            title="review-gate failed"
          fi
          summary=$(printf '%s' "$out" | head -c 60000)
          gh api -X POST "repos/$REPO/check-runs" \
            -f name="Review Gate" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary"
          # Job exit does not satisfy required checks for this event; the Checks API
          # run above is what rulesets evaluate. Keep the job red for visibility.
          exit "$rc"
