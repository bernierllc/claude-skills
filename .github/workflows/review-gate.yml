name: Review Gate
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: review-gate-runner
    runs-on: ubuntu-latest
    steps:
      - name: scratch gate (mode reuse)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MODE: reuse
        run: |
          set -euo pipefail
          external_id="review-gate-pr-$PR_NUMBER"
          check_ids=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Review%20Gate&filter=all&per_page=100" --paginate \
              | jq -r --arg ext "$external_id" '.check_runs[] | select(.name == "Review Gate" and .app.slug == "github-actions" and .external_id == $ext) | .id')
          if [ "$MODE" = new ] || [ -z "$check_ids" ]; then
            new=$(gh api -X POST "repos/$REPO/check-runs" -f name="Review Gate" -f head_sha="$SHA" -f external_id="$external_id" --jq .id)
            check_ids="$check_ids $new"
          fi
          for id in $check_ids; do
            gh api -X PATCH "repos/$REPO/check-runs/$id" -f status=completed -f conclusion=success \
              -f "output[title]=scratch ok" -f "output[summary]=scratch mode $MODE" >/dev/null
          done
