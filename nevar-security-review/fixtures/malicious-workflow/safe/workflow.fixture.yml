name: PR checks
on:
  pull_request:
    types: [opened, edited, synchronize]
# PR code runs with a read-only token and no secrets; labeling, which needs a write
# token, belongs in a separate base-side workflow that never runs PR code.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts && npm test
      - run: echo "Checking $PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
